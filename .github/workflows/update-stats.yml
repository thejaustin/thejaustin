name: Update Stats

on:
  schedule:
    - cron: "7 * * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-stats.yml"
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README stats and cards
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}  # STATS_TOKEN (read access to your repos) lets CI see draft pre-releases
        run: python3 scripts/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -N assets data
          git diff --quiet README.md assets data || {
            git add README.md assets data
            git commit -m "chore: auto-update stats"
            git pull --rebase --autostash
            git push
          }
