name: Update Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py

      - name: Generate stat cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -N assets data
          git diff --quiet README.md assets data || {
            git add README.md assets data
            git commit -m "chore: auto-update stats"
            git pull --rebase
            git push
          }
