<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats · thejaustin</title>
<meta name="description" content="Stars, downloads and followers for thejaustin's open-source projects, with growth over the window you pick.">
<link rel="icon" href="https://thejaustin.github.io/favicon.ico">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<style>
:root {
  --bg:#ffffff; --card:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
  --accent:#0969da; --up:#1a7f37; --chip:#eaeef2; --fill:rgba(9,105,218,.12);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8d96a0;
          --accent:#58a6ff; --up:#3fb950; --chip:#21262d; --fill:rgba(88,166,255,.16); }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
a { color:var(--accent); }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
.wrap { max-width:880px; margin:0 auto; padding:0 16px; }
header.top { border-bottom:1px solid var(--line); }
header.top .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 16px; padding-top:14px; padding-bottom:14px; }
.brand { font-weight:700; color:var(--text); text-decoration:none; }
.brand span { color:var(--muted); font-weight:400; }
header nav { display:flex; gap:18px; font-size:15px; }
header nav a { color:var(--muted); text-decoration:none; padding:6px 0; }
header nav a:hover { color:var(--text); }
main { padding:28px 0 56px; }
h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.01em; }
.sub { color:var(--muted); margin:0 0 20px; }
.live { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; margin-bottom:20px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
.live.ok .dot { background:var(--up); }
.live.stale .dot { background:#d29922; }

.seg { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin:0 -16px 20px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
.seg::-webkit-scrollbar { display:none; }
.seg button { flex:none; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--line);
  background:var(--chip); cursor:pointer; font-size:14px; }
.seg button[aria-checked="true"] { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

.tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.tile { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; min-width:0; }
.tile[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.tile .k { display:block; color:var(--muted); font-size:13px; }
.tile .v { display:block; font-size:24px; font-weight:700; line-height:1.25; }
.tile .d { display:block; font-size:13px; font-weight:600; color:var(--muted); }
.tile .d.up { color:var(--up); }
.tile svg { display:block; width:100%; height:24px; margin-top:6px; }

.panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 14px 10px; margin-bottom:16px; }
.panel h2 { font-size:14px; color:var(--muted); font-weight:600; margin:0 0 8px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.panel h2 output { color:var(--text); font-weight:600; }
svg.chart { width:100%; height:auto; display:block; touch-action:pan-y; }

.sort { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 6px; }
.sort button { min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--chip); font-size:13px; cursor:pointer; }
.sort button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
.rows { list-style:none; margin:0; padding:0; }
.rows li { display:grid; grid-template-columns:1fr auto auto; gap:2px 14px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); }
.rows li:last-child { border-bottom:0; }
.rows .n { font-weight:600; text-decoration:none; overflow-wrap:anywhere; }
.rows .m { text-align:right; font-variant-numeric:tabular-nums; font-size:15px; min-width:4.5em; }
.rows .m small { display:block; color:var(--muted); font-size:12px; }
.rows .bar { grid-column:1 / -1; height:4px; border-radius:2px; background:var(--chip); overflow:hidden; }
.rows .bar i { display:block; height:100%; background:var(--accent); border-radius:2px; }
.up { color:var(--up); font-weight:600; }
.zero { color:var(--muted); }
.note { color:var(--muted); font-size:13px; margin:8px 0 0; }
.empty { color:var(--muted); font-size:14px; padding:20px 0; text-align:center; }
@media (max-width:480px) {
  .tile .v { font-size:20px; }
  .tile { padding:10px; }
  .rows li { grid-template-columns:1fr auto auto; gap:2px 10px; }
}
@media (prefers-reduced-motion:no-preference) { .bar i { transition:width .3s ease; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="https://thejaustin.github.io/">thejaustin <span>/ stats</span></a>
  <nav aria-label="Main">
    <a href="https://thejaustin.github.io/">Home</a>
    <a href="https://github.com/thejaustin">GitHub</a>
  </nav>
</div></header>

<main class="wrap">
  <h1>Project stats</h1>
  <p class="sub">How stars, downloads and followers have grown. Pick a time window to compare.</p>
  <div class="live" id="live" role="status"><span class="dot"></span><span id="live-t">Loading…</span></div>

  <div class="seg" id="seg" role="radiogroup" aria-label="Time window"></div>
  <div class="tiles" id="tiles" role="group" aria-label="Metric"></div>

  <section class="panel" aria-labelledby="ct">
    <h2><span id="ct"></span><output id="hover" aria-live="off"></output></h2>
    <svg class="chart" id="chart" viewBox="0 0 600 200" role="img" aria-label="Trend for the selected metric"></svg>
  </section>

  <section class="panel" aria-labelledby="pt">
    <h2 id="pt"></h2>
    <div class="sort" id="sort" role="group" aria-label="Sort projects"></div>
    <ul class="rows" id="rows"></ul>
  </section>

  <p class="note" id="note"></p>
</main>

<script>
const DATA = "https://raw.githubusercontent.com/thejaustin/thejaustin/main/data/stats-history.json";
const WINDOWS = [["1h",1],["3h",3],["6h",6],["12h",12],["24h",24],["7d",168],["30d",720]];
const METRICS = [
  { key:"stars", label:"Stars", pk:0 },
  { key:"dl", label:"Downloads", pk:1 },
  { key:"followers", label:"Followers", pk:null },
];
const SORTS = [["gs","Stars gained"],["gd","Downloads gained"],["tot","Most stars"]];
const SLACK = 900;           // cron runs start a few minutes late
const STALE = 3 * 3600;      // older than this and the data is flagged
const state = { win:"24h", metric:"stars", sort:"gs", hist:[], loaded:0 };

const $ = id => document.getElementById(id);
const fmt = n => Math.abs(n) >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"") + "k" : String(n);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hoursOf = w => Object.fromEntries(WINDOWS)[w];

function baseFor(hours, now){
  let base = null;
  for (const e of state.hist) if (now - e.t >= hours*3600 - SLACK) base = e;
  return base;
}
function gain(n){
  if (n == null) return `<span class="zero">–</span>`;
  return n > 0 ? `<span class="up">↑${fmt(n)}</span>` : `<span class="zero">0</span>`;
}
function ago(t){
  const m = Math.max(0, Math.round((Date.now()/1000 - t)/60));
  return m < 2 ? "just now" : m < 90 ? m + " min ago" : Math.round(m/60) + " h ago";
}
function spark(points, key){
  if (points.length < 2) return "";
  const ys = points.map(e => e[key]), y0 = Math.min(...ys), y1 = Math.max(...ys), x0 = points[0].t, x1 = points[points.length-1].t;
  const d = points.map((e,i) => (i?"L":"M") + (((e.t-x0)/((x1-x0)||1))*100).toFixed(1) + " " + (22 - ((e[key]-y0)/((y1-y0)||1))*20).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${css("--accent")}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function render(){
  const hist = state.hist, last = hist[hist.length-1];
  if (!last) { $("note").textContent = "No data yet."; return; }
  const hours = hoursOf(state.win), base = baseFor(hours, last.t);
  const from = last.t - hours*3600;
  let pts = hist.filter(e => e.t >= from - SLACK);
  if (pts.length < 2) pts = hist.slice(-2);

  $("seg").innerHTML = WINDOWS.map(([l]) =>
    `<button type="button" role="radio" data-w="${l}" aria-checked="${l===state.win}">${l}</button>`).join("");

  $("tiles").innerHTML = METRICS.map(m => {
    const d = base ? last[m.key] - base[m.key] : null;
    return `<button type="button" class="tile" data-m="${m.key}" aria-pressed="${m.key===state.metric}">
      <span class="k">${m.label}</span><span class="v">${fmt(last[m.key])}</span>
      <span class="d ${d>0?"up":""}">${d==null?"No data yet":d>0?"↑"+fmt(d)+" · "+state.win:"No change · "+state.win}</span>
      ${spark(pts, m.key)}</button>`;
  }).join("");

  const m = METRICS.find(x => x.key === state.metric);
  $("ct").textContent = `${m.label} · last ${state.win}`;
  drawChart(pts.map(e => [e.t, e[m.key]]), m.label);

  // projects
  $("pt").textContent = `Projects · last ${state.win}`;
  $("sort").innerHTML = SORTS.map(([k,l]) => `<button type="button" data-s="${k}" aria-pressed="${k===state.sort}">${l}</button>`).join("");
  const rows = Object.keys(last.p || {}).map(n => {
    const now = last.p[n], old = base && base.p && base.p[n];
    return { n, s:now[0], d:now[1], ds: old ? now[0]-old[0] : null, dd: old ? now[1]-old[1] : null };
  });
  const val = r => state.sort === "gs" ? (r.ds||0) : state.sort === "gd" ? (r.dd||0) : r.s;
  rows.sort((a,b) => val(b) - val(a) || b.s - a.s);
  const max = Math.max(1, ...rows.map(val));
  $("rows").innerHTML = rows.length ? rows.map(r => `<li>
    <a class="n" href="https://github.com/thejaustin/${r.n}">${r.n}</a>
    <span class="m">${fmt(r.s)} ★<small>${gain(r.ds)}</small></span>
    <span class="m">${r.d ? fmt(r.d) + " ⬇<small>" + gain(r.dd) + "</small>" : "<span class='zero'>–</span>"}</span>
    <span class="bar"><i style="width:${Math.round(val(r)/max*100)}%"></i></span></li>`).join("")
    : `<li class="empty">Per-project numbers appear after the next hourly update.</li>`;

  const have = Math.max(1, Math.round((last.t - hist[0].t)/3600));
  $("note").textContent = (base ? "" : `Not enough history for ${state.win} yet (${have} h collected), so gains show once it builds up. `)
    + "Only growth is shown. Numbers refresh hourly.";
  fresh();
}

function fresh(){
  const last = state.hist[state.hist.length-1]; if (!last) return;
  const age = Date.now()/1000 - last.t, el = $("live");
  el.className = "live " + (age > STALE ? "stale" : "ok");
  $("live-t").textContent = "Updated " + ago(last.t) + (age > STALE ? " · the hourly update may be delayed" : "");
}

function drawChart(points, label){
  const W=600, H=200, P={l:44,r:14,t:14,b:26};
  const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs); let y0=Math.min(...ys), y1=Math.max(...ys);
  if (y0===y1) { y0 -= 1; y1 += 1; }
  const sx = t => P.l + (x1===x0 ? 0 : (t-x0)/(x1-x0))*(W-P.l-P.r);
  const sy = v => H-P.b - (v-y0)/(y1-y0)*(H-P.t-P.b);
  const line = points.map((p,i)=>(i?"L":"M")+sx(p[0]).toFixed(1)+" "+sy(p[1]).toFixed(1)).join(" ");
  const area = line + ` L${sx(x1).toFixed(1)} ${H-P.b} L${sx(x0).toFixed(1)} ${H-P.b} Z`;
  const fmtT = t => new Date(t*1000).toLocaleString([], x1-x0 > 172800 ? {month:"short", day:"numeric"} : {hour:"numeric", minute:"2-digit"});
  const fmtFull = t => new Date(t*1000).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  const mu = css("--muted"), ln = css("--line"), ac = css("--accent");
  $("chart").innerHTML = `
    <line x1="${P.l}" x2="${W-P.r}" y1="${sy(y0)}" y2="${sy(y0)}" stroke="${ln}"/>
    <line x1="${P.l}" x2="${W-P.r}" y1="${sy(y1)}" y2="${sy(y1)}" stroke="${ln}" stroke-dasharray="3 4"/>
    <text x="${P.l-6}" y="${sy(y1)+4}" text-anchor="end" font-size="12" fill="${mu}">${fmt(Math.round(y1))}</text>
    <text x="${P.l-6}" y="${sy(y0)+4}" text-anchor="end" font-size="12" fill="${mu}">${fmt(Math.round(y0))}</text>
    <text x="${P.l}" y="${H-6}" font-size="12" fill="${mu}">${fmtT(x0)}</text>
    <text x="${W-P.r}" y="${H-6}" text-anchor="end" font-size="12" fill="${mu}">${fmtT(x1)}</text>
    <path d="${area}" fill="${css("--fill")}"/>
    <path d="${line}" fill="none" stroke="${ac}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <g id="cursor" visibility="hidden"><line y1="${P.t}" y2="${H-P.b}" stroke="${mu}" stroke-dasharray="2 3"/><circle r="4.5" fill="${ac}" stroke="${css("--bg")}" stroke-width="2"/></g>
    <circle id="endpt" cx="${sx(xs[xs.length-1])}" cy="${sy(ys[ys.length-1])}" r="4" fill="${ac}"/>`;
  const out = $("hover"), svg = $("chart"), cur = svg.querySelector("#cursor");
  out.textContent = "";
  function at(ev){
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    let best = 0;
    points.forEach((p,i) => { if (Math.abs(sx(p[0])-x) < Math.abs(sx(points[best][0])-x)) best = i; });
    const [t,v] = points[best];
    cur.setAttribute("visibility","visible");
    cur.querySelector("line").setAttribute("x1", sx(t)); cur.querySelector("line").setAttribute("x2", sx(t));
    cur.querySelector("circle").setAttribute("cx", sx(t)); cur.querySelector("circle").setAttribute("cy", sy(v));
    out.textContent = `${v.toLocaleString()} ${label.toLowerCase()} · ${fmtFull(t)}`;
  }
  svg.onpointermove = at; svg.onpointerdown = at;
  svg.onpointerleave = () => { cur.setAttribute("visibility","hidden"); out.textContent = ""; };
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.w) { state.win = b.dataset.w; store.set("win", state.win); history.replaceState(null, "", "#" + state.win); }
  else if (b.dataset.m) state.metric = b.dataset.m;
  else if (b.dataset.s) state.sort = b.dataset.s;
  else return;
  render();
  const on = document.querySelector('.seg [aria-checked="true"]'); if (on && b.dataset.w) on.scrollIntoView({inline:"center", block:"nearest"});
});

const wanted = location.hash.slice(1) || store.get("win");
if (wanted && WINDOWS.some(w => w[0] === wanted)) state.win = wanted;

function load(){
  // The 5-minute query bucket gets past raw.githubusercontent's cache without hammering it.
  fetch(DATA + "?m=" + Math.floor(Date.now()/300000), { cache:"no-cache" })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(h => { state.hist = h.sort((a,b)=>a.t-b.t); state.loaded = Date.now(); render(); })
    .catch(() => {
      if (!state.loaded) { $("live-t").textContent = "Couldn't load the stats data. Try again in a moment."; $("live").className = "live stale"; }
    });
}
load();
setInterval(() => { if (!document.hidden && Date.now() - state.loaded > 600000) load(); else fresh(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.loaded > 600000) load(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.hist.length && render());
</script>
</body>
</html>
