<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" role="img" aria-label="Hi, I'm Austin. Android engineer building open-source tools.">
<style>
.l{font:500 22px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#36BCF7;animation:s 12s infinite}
@keyframes s{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l{animation:none}}
</style>
<rect x=".5" y=".5" width="799" height="159" rx="12" fill="#1a1b27" stroke="#2f3146"/>
<text x="400" y="72" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#c0caf5">Hi, I'm Austin</text>
<text class="l" x="400" y="118" text-anchor="middle" style="animation-delay:0s;opacity:1">Android engineer · Open-source tools</text>
<text class="l" x="400" y="118" text-anchor="middle" style="animation-delay:3s;opacity:0">Shizuku · Dhizuku · Samsung One UI</text>
<text class="l" x="400" y="118" text-anchor="middle" style="animation-delay:6s;opacity:0">Kotlin · Jetpack Compose · Flutter</text>
<text class="l" x="400" y="118" text-anchor="middle" style="animation-delay:9s;opacity:0">Extending what Android can do</text>
</svg>
